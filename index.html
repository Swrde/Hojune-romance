<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff8fae">
<title>예끼! 보인대 로맨스</title>
<!--
  ★ Gemini API 키
  - 아래 <script> 맨 위 CONFIG 의 GEMINI_API_KEYS 에 키 2개가 들어 있어요.
    하나가 막히면(한도 초과·인증 오류) 자동으로 다른 키로 넘어가요. 키를 더 넣거나 바꿔도 돼요.
  - 게임 안 [설정]에서 다른 키를 넣으면, 그 기기에서는 그 키를 써요.
  ※ 키를 넣은 파일을 친구에게 주거나 인터넷에 올리면 키가 그대로 보여요.
     퍼졌다 싶으면 https://aistudio.google.com/apikey 에서 지우고 새로 만들면 돼요.
     결제(빌링)를 연결하지 않은 무료 키를 쓰면 돈이 나갈 일은 없어요.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* VOICE: 설렘·코믹·잔잔 — 장난스럽고 다정한 캠퍼스 연애 시뮬레이션
   IDEA: 보인대학교 캠퍼스를 무대로 한 세로형 비주얼 노벨
   PICTURE: 장소마다 다른 일러스트 배경 위, 표정이 바뀌는 이호순 스탠딩
   COLOUR+TYPE: 벚꽃 핑크 주색, 호순 레드 포인트, 하늘·노을 배경 / 제목 Jua, 본문 Gowun Dodum
   LAYOUT: 위 HUD · 가운데 캐릭터 · 아래 대화창과 입력창, 넓은 화면에선 가운데 폰 프레임 */
:root{color-scheme:light;--pink:#ff5c8a;--pinkD:#d63c6c;--pink2:#ffc2d3;--pink3:#fff0f4;--ink:#2b2233;--sub:#7d6c7a;--paper:#fffdfb;--red:#e23b44;--appH:100vh;--barH:0px;
--f:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif;--d:'Jua','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK KR',sans-serif}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{font:16px/1.55 var(--f);color:var(--ink);background:#ffd6e2 radial-gradient(#ffb7ca 1.5px,transparent 1.7px) 0 0/22px 22px;display:flex;align-items:center;justify-content:center}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ffd23f;outline-offset:2px}
#game{position:relative;width:100%;max-width:460px;height:var(--appH);overflow:hidden;background:#f3ebe0;isolation:isolate;-webkit-user-select:none;user-select:none}
@media (min-width:600px) and (min-height:700px){#game{height:min(calc(var(--appH) - 48px),900px);border-radius:32px;box-shadow:0 0 0 10px var(--ink),0 30px 80px rgba(110,20,60,.35)}}
#scene,#fx{position:absolute;inset:0}
#scene svg{width:100%;height:100%;display:block}
#fx{z-index:2;pointer-events:none;overflow:hidden}

#char{position:absolute;left:0;right:0;bottom:calc(var(--barH) + 64px);height:min(60%,560px);z-index:3;display:flex;justify-content:center;align-items:flex-end;pointer-events:none;opacity:0;transform:translateY(24px);transition:opacity .35s,transform .35s}
#char.on{opacity:1;transform:none}
#charBob{height:100%;display:flex;align-items:flex-end;justify-content:center;animation:bob 4.5s ease-in-out infinite}
#charArt{height:100%;display:flex;align-items:flex-end;justify-content:center}
#charArt svg,#charArt img{height:100%;width:auto;max-width:118vw;object-fit:contain;object-position:bottom;filter:drop-shadow(0 10px 18px rgba(60,20,40,.28))}
#charArt.hop{animation:hop .42s ease}
#emote{position:absolute;top:3%;left:calc(50% + 62px);width:56px;height:56px;opacity:0;transform:scale(.3) rotate(-12deg);transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1)}
#emote.show{opacity:1;transform:none}
#emote svg{width:100%;height:100%}
[data-mode=title] #char{bottom:30%;height:50%}
[data-mode=ending] #char{bottom:44%;height:46%}
@media (max-height:560px){#char{height:50%}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes hop{35%{transform:translateY(-14px)}}

#dialog{position:absolute;left:10px;right:10px;bottom:calc(var(--barH) + 12px);z-index:5;min-height:122px;padding:24px 18px 18px;background:rgba(255,253,251,.95);border:2.5px solid var(--pink2);border-radius:22px;box-shadow:0 10px 30px rgba(60,20,40,.2);display:none;cursor:pointer}
#dialog.on{display:block}
#nameTag{position:absolute;top:-17px;left:16px;background:var(--pink);color:#fff;font:18px/1 var(--d);padding:8px 16px 7px;border-radius:999px;box-shadow:0 3px 0 var(--pinkD)}
#nameTag:empty{display:none}
#dialog.me #nameTag{background:var(--ink);box-shadow:0 3px 0 #000}
#dialog.narr{background:rgba(43,34,51,.88);border-color:rgba(255,255,255,.22)}
#dialog.narr #text{color:#fff;text-align:center}
#action{font-size:13px;color:var(--sub)}
#action:empty{display:none}
#text{font-size:17px;line-height:1.62;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;max-height:30vh;overflow:auto}
#dialog.wait::after{content:'';position:absolute;right:16px;bottom:9px;border:7px solid transparent;border-top:9px solid var(--pink);border-bottom:0;animation:blink 1s infinite}
#dialog.narr.wait::after{border-top-color:#fff}
.typing i{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:var(--pink);opacity:.35;animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{40%{opacity:1;transform:translateY(-4px)}}
@keyframes blink{50%{opacity:.2}}

#choices{position:absolute;left:18px;right:18px;top:17%;z-index:6;display:none;flex-direction:column;gap:10px}
#choices.on{display:flex;animation:pop .3s ease}
.ctitle{margin:0 0 4px;text-align:center;color:#fff;font:21px/1.3 var(--d);text-shadow:0 2px 8px rgba(0,0,0,.55)}
.choice{min-height:54px;padding:12px 18px;background:rgba(255,255,255,.97);border:2.5px solid var(--pink2);border-radius:18px;font:17px/1.35 var(--d);text-align:left;box-shadow:0 4px 0 var(--pink2)}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pink2)}

#inputBar{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(rgba(43,34,51,0),rgba(43,34,51,.62) 45%);display:none}
#inputBar.on{display:block}
#chips{display:flex;gap:6px;overflow-x:auto;padding:0 2px 8px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.95);border:1.5px solid var(--pink2);font-size:14px;white-space:nowrap;min-height:38px}
.chip:disabled{opacity:.5}
#chatForm{display:flex;gap:8px}
#chatInput{flex:1;height:48px;border-radius:24px;border:2px solid #fff;padding:0 18px;font-size:16px;background:#fff;outline:none;-webkit-user-select:text;user-select:text}
#chatInput:focus{border-color:var(--pink)}
#sendBtn{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--pink);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--pinkD)}
#sendBtn:disabled{opacity:.5}
#dayDone{width:100%}
#talkInfo{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#fff;padding:7px 6px 0;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.pips i{display:inline-block;width:9px;height:9px;margin-left:4px;border-radius:50%;border:1.5px solid #fff;vertical-align:-1px}
.pips i.on{background:var(--pink);border-color:var(--pink)}

#hud{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;z-index:12;display:none;align-items:center;gap:8px}
[data-mode=play] #hud,[data-mode=map] #hud{display:flex}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.94);border-radius:999px;padding:7px 12px;box-shadow:0 3px 12px rgba(0,0,0,.12);font-size:14px;white-space:nowrap}
.dayPill b{font:16px/1 var(--d);color:var(--pink)}
#hudPlace:empty{display:none}
.affPill{margin-left:auto}
.affPill.hide{visibility:hidden}
.bar{width:64px;height:8px;border-radius:99px;background:#ffe0ea;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8fb1,var(--pink));border-radius:99px;transition:width .5s}
#affNum{font:16px/1 var(--d);min-width:22px;text-align:right}
#affLbl{color:var(--sub);font-size:12px}
@media (max-width:400px){#affLbl{display:none}.bar{width:46px}}
.iconBtn{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.94);display:grid;place-items:center;box-shadow:0 3px 12px rgba(0,0,0,.12)}

.screen{position:absolute;inset:0;z-index:10;display:none;flex-direction:column}
.screen.on{display:flex;animation:fade .35s ease}
@keyframes fade{from{opacity:0}}
.logo{margin-top:calc(50px + env(safe-area-inset-top));text-align:center;padding:0 16px}
.l1,.l2{font-family:var(--d);line-height:1.05;--o:#fff;text-shadow:3px 0 var(--o),-3px 0 var(--o),0 3px var(--o),0 -3px var(--o),2px 2px var(--o),-2px -2px var(--o),2px -2px var(--o),-2px 2px var(--o),0 8px 0 rgba(140,30,70,.22)}
.l1{display:inline-block;font-size:clamp(52px,16vw,72px);color:var(--red);transform:rotate(-5deg)}
.l2{display:block;font-size:clamp(34px,10.5vw,46px);color:var(--pink);margin-top:4px}
.l3{display:inline-block;margin-top:12px;background:rgba(255,255,255,.92);padding:5px 14px;border-radius:999px;font-size:14px}
.tMenu{margin-top:auto;padding:26px 18px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(rgba(43,34,51,0),rgba(43,34,51,.66) 34%);display:flex;flex-direction:column;gap:10px}
.aiStatus{margin:2px 0 0;color:#fff;font-size:13px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.6)}

.btn{min-height:48px;padding:10px 18px;border-radius:16px;border:0;background:var(--pink);color:#fff;font:18px/1.2 var(--d);box-shadow:0 4px 0 var(--pinkD);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pinkD)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--pink2);border:2px solid var(--pink2)}
.btn.big{min-height:56px;font-size:20px}
.btn.sm{min-height:44px;font-size:15px;padding:8px 12px}
.btn small{font:14px/1 var(--f);opacity:.7;margin-left:8px}
.btn:disabled{opacity:.45}
.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>.btn{flex:1 1 0}
label.btn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}

#sDay{background:linear-gradient(165deg,#ff7aa2,#ffb08a);color:#fff;align-items:center;justify-content:center;cursor:pointer}
#sDay.rain{background:linear-gradient(165deg,#61748c,#a6b5c6)}
#sDay.night{background:linear-gradient(165deg,#0f1733,#2c356e)}
.dc{text-align:center;padding:24px}
.dcIcon svg{width:60px;height:60px}
.dcSmall{margin:6px 0 0;font:20px/1 var(--d);opacity:.92}
.dcNum{margin:4px 0;font:clamp(96px,30vw,132px)/1 var(--d);text-shadow:0 6px 0 rgba(0,0,0,.12)}
.dcNum span{font-size:.3em;opacity:.8}
.dcTitle{margin:6px 0 0;font:28px/1.25 var(--d);text-wrap:balance}
.dcHint{margin:28px 0 0;font-size:14px;opacity:.85;animation:blink 1.4s infinite}
#sEnd{background:var(--ink);color:#fff;align-items:center;justify-content:center}
#sEnd .dcTitle{font-size:22px;max-width:320px;margin:10px auto 0}
.dcAff{margin:16px 0 0;font-size:16px}.dcAff b{color:#ff9dbb;font:20px/1 var(--d)}
.dcMemo{margin:12px auto 24px;max-width:300px;font-size:14px;color:#d9cfe0}

#sMap{background:rgba(255,240,244,.97);overflow-y:auto;padding:calc(70px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom))}
.mapHead .dcSmall{color:var(--pink);font-size:16px;margin:0}
.mapHead h2{margin:4px 0 14px;font:26px/1.2 var(--d)}
.mapGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.place{display:flex;flex-direction:column;text-align:left;padding:0;border:2px solid var(--pink2);border-radius:18px;background:#fff;overflow:hidden;box-shadow:0 4px 0 var(--pink2)}
.place:active{transform:translateY(3px)}
.thumb{position:relative;display:block;aspect-ratio:4/3;overflow:hidden}
.thumb svg{position:absolute;inset:0;width:100%;height:100%}
.place b{padding:8px 10px 0;font:17px/1.2 var(--d)}
.place small{padding:2px 10px 10px;color:var(--sub);font-size:13px;line-height:1.35}

#sEnding{justify-content:flex-end}
.endCard{margin:0 10px calc(12px + env(safe-area-inset-bottom));background:rgba(255,253,251,.96);border-radius:24px;padding:20px 18px;max-height:56%;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.endCard h2{margin:8px 0 10px;font:28px/1.15 var(--d)}
.endCard p{margin:0 0 8px}
.endTag{display:inline-block;padding:5px 12px;border-radius:999px;color:#fff;font:14px/1 var(--d)}
.endTag.happy{background:var(--pink)}.endTag.normal{background:#f2a13b}.endTag.bad{background:#6c6f86}
.endStat{color:var(--sub);font-size:14px;margin-top:12px!important}
.hint{color:var(--pink);font-family:var(--d)}

#ov{position:absolute;inset:0;z-index:20;background:rgba(43,34,51,.58);display:none;align-items:center;justify-content:center;padding:16px}
#ov.on{display:flex}
.panel{width:100%;max-height:88%;overflow:auto;background:var(--paper);border-radius:24px;padding:20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .25s ease;-webkit-user-select:text;user-select:text}
.panel h2{margin:0 0 10px;font:24px/1.2 var(--d)}
.panel h3{margin:18px 0 6px;font:17px/1.2 var(--d);color:var(--pink)}
.panel p{margin:0 0 10px}
.panel input:not([type=checkbox]):not([type=file]),.panel textarea{width:100%;font-size:16px;padding:12px 14px;border:2px solid var(--pink2);border-radius:14px;background:#fff;outline:none;margin-bottom:10px;resize:none}
.panel input:focus,.panel textarea:focus{border-color:var(--pink)}
.muted{color:var(--sub);font-size:14px}
#keyState{white-space:pre-line}
.menuList,.slots{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.menuList .btn{width:100%}
.slot{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;padding:12px 14px;border:2px solid var(--pink2);border-radius:14px;background:#fff}
.slot b{font:17px/1.2 var(--d)}.slot small{color:var(--sub);font-size:13px}
.slot:disabled{opacity:.5}
.tog{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.tog input{width:22px;height:22px;accent-color:var(--pink);margin:0;flex:none}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.seg{display:flex;gap:4px;background:var(--pink3);padding:4px;border-radius:12px}
.seg button{min-height:36px;padding:0 10px;border:0;background:transparent;border-radius:9px;font-size:14px}
.seg button.on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.1);font-weight:bold}
.log{max-height:58vh;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.log p{margin:0;padding:8px 12px;border-radius:14px;background:#fff;font-size:15px;border:1.5px solid var(--pink3)}
.log p b{display:block;font:13px/1.3 var(--d);color:var(--pink)}
.log p.m{background:#f3f0f8}.log p.m b{color:var(--ink)}
.log p.n{background:transparent;border:0;color:var(--sub);text-align:center;font-size:13px}
.ideas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ideas .chip{white-space:normal;text-align:left}
.bookRow{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 0;border-bottom:1px dashed var(--pink2)}
.bookRow b{font:18px/1.2 var(--d)}.bookRow.locked b{color:#b9adb6}
.bookRow small{color:var(--sub)}
.cmsg{font-size:17px;margin:4px 0 16px!important}

#toast{position:absolute;left:50%;top:calc(66px + env(safe-area-inset-top));z-index:30;transform:translate(-50%,-8px);width:max-content;max-width:88%;background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#bang{position:absolute;inset:0;z-index:25;display:grid;place-items:center;pointer-events:none;font:clamp(80px,26vw,120px)/1 var(--d);color:var(--red);--o:#fff;text-shadow:4px 0 var(--o),-4px 0 var(--o),0 4px var(--o),0 -4px var(--o),3px 3px var(--o),-3px -3px var(--o),3px -3px var(--o),-3px 3px var(--o);opacity:0}
#bang.on{animation:bang .9s ease forwards}
@keyframes bang{0%{opacity:0;transform:scale(.3) rotate(-14deg)}25%{opacity:1;transform:scale(1.15) rotate(-6deg)}70%{opacity:1;transform:scale(1) rotate(-6deg)}100%{opacity:0;transform:scale(1.05) rotate(-6deg)}}
#game.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.delta{position:absolute;z-index:13;top:calc(56px + env(safe-area-inset-top));right:64px;font:24px/1 var(--d);color:var(--pink);--o:#fff;text-shadow:2px 0 var(--o),-2px 0 var(--o),0 2px var(--o),0 -2px var(--o);pointer-events:none;animation:rise 1.4s ease-out forwards}
.delta.down{color:#6c6f86}
@keyframes rise{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#fx.rain i{position:absolute;top:-90px;width:2px;height:72px;background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.75));transform:rotate(12deg);animation:fall linear infinite}
@keyframes fall{to{transform:translate(-120px,1100px) rotate(12deg)}}
.burst{position:absolute;width:0;height:0}
.burst i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);opacity:0;animation:burst 2.2s ease-out infinite;animation-delay:var(--dl)}
@keyframes burst{0%{transform:rotate(var(--a)) translateY(0);opacity:1}70%{opacity:1}100%{transform:rotate(var(--a)) translateY(-78px);opacity:0}}
@keyframes pop{from{transform:scale(.94);opacity:0}}
@media (prefers-reduced-motion:reduce){#charBob,#charArt.hop,#fx.rain i,.dcHint,#dialog.wait::after,#bang.on{animation:none!important}.burst i{animation:none!important;opacity:1;transform:rotate(var(--a)) translateY(-50px)}}
</style>
</head>
<body>
<div id="game" data-mode="title">
  <div id="scene"></div>
  <div id="fx"></div>
  <div id="char"><div id="charBob"><div id="charArt"></div></div><div id="emote"></div></div>
  <div id="dialog" aria-live="polite"><div id="nameTag"></div><div id="action"></div><div id="text"></div></div>
  <div id="choices"></div>
  <div id="inputBar">
    <div id="chips"></div>
    <form id="chatForm" autocomplete="off">
      <input id="chatInput" maxlength="140" placeholder="호순이에게 말 걸기…" enterkeyhint="send" aria-label="대화 입력">
      <button id="sendBtn" aria-label="보내기"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M3.5 11.2 20 4l-6.4 16.4-2.9-6.6z" fill="currentColor"/></svg></button>
    </form>
    <button id="dayDone" class="btn" type="button" hidden>오늘은 여기까지</button>
    <div id="talkInfo"></div>
  </div>

<p class="muted">기본 그림 대신 원하는 그림을 넣을 수 있어요. (이 기기에만 저장)</p>
<div class="row"><label class="btn sm">그림 고르기<input type="file" id="oImg" accept="image/*" hidden></label>${IMG ? '<button class="btn ghost sm" id="oImgDel">기본 그림으로</button>' : ''}</div>
<h3>데이터</h3>
<button class="btn ghost sm wide" id="oWipe">모든 저장 데이터 지우기</button>
<p></p><button class="btn wide" id="oClose">닫기</button>`);
  $('#oHide').onchange = e => { OPT.hideAff = e.target.checked; saveOpt(); hud(); };
  $('#oSpeed').onclick = e => { const b = e.target.closest('button'); if (!b) return; OPT.speed = +b.dataset.i; saveOpt(); document.querySelectorAll('#oSpeed button').forEach(x => x.classList.toggle('on', x === b)); };
  $('#oDemo').onchange = e => { OPT.demo = e.target.checked; saveOpt(); refreshAI(); };
  $('#oKeySave').onclick = () => { const v = $('#oKey').value.trim(); if (!v) { setKS('키를 붙여넣어 주세요.'); return; } STORE.set('key', v); setKS('키를 저장했어요. "연결 테스트"로 확인해 보세요.'); refreshAI(); };
  const del = $('#oKeyDel'); if (del) del.onclick = () => { STORE.del('key'); refreshAI(); openSettings(); };
  $('#oKeyTest').onclick = testKey;
  const onl = $('#oOnline'); if (onl) onl.onclick = () => { S.offline = false; toast('다시 AI와 대화해요!'); refreshAI(); openSettings(); };
  $('#oImg').onchange = onImg;
  const idel = $('#oImgDel'); if (idel) idel.onclick = () => { IMG = null; STORE.del('img'); renderChar(curEmo); openSettings(); };
  $('#oWipe').onclick = async () => {
    if (!(await confirmBox('저장 슬롯, 설정, 키, 엔딩 기록까지 모두 지울까요?', '모두 지우기'))) { openSettings(); return; }
    try { Object.keys(localStorage).filter(k => k.startsWith(P)).forEach(k => localStorage.removeItem(k)); } catch (e) { /* 저장소 없음 */ }
    IMG = null; OPT = Object.assign({}, DEF_OPT); toast('모두 지웠어요.'); showTitle();
  };
  $('#oClose').onclick = closeOv;
}
async function testKey() {
  const v = $('#oKey').value.trim(); if (v && v !== ownKey()) STORE.set('key', v);
  const keys = keyList();
  if (!keys.length) { setKS('먼저 API 키를 넣어 주세요.'); return; }
  const b = $('#oKeyTest'); b.disabled = true;
  const out = keys.map((k, i) => `키${i + 1} (…${k.slice(-4)}): 확인 중…`); setKS(out.join('\n'));
  for (let i = 0; i < keys.length; i++) {
    try { const { model } = await gemini('Reply with this JSON only: {"ok":true}', [{ role: 'user', parts: [{ text: 'ping' }] }], 64, keys[i]); quotaUse(); out[i] = `키${i + 1} (…${keys[i].slice(-4)}): 연결 성공 · ${model}`; }
    catch (e) { out[i] = `키${i + 1} (…${keys[i].slice(-4)}): 실패 — ${errMsg(e)}`; }
    setKS(out.join('\n'));
  }
  if (b.isConnected) b.disabled = false;
  refreshAI();
}
function onImg(e) {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 720 / im.height, 720 / im.width), cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(im.width * k)); cv.height = Math.max(1, Math.round(im.height * k));
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      let url = cv.toDataURL('image/webp', .86); if (!url.startsWith('data:image/webp')) url = cv.toDataURL('image/png');
      IMG = url; const ok = STORE.set('img', url); renderChar(curEmo);
      toast(ok ? '캐릭터 그림을 바꿨어요!' : '저장 공간이 부족해서 이번 실행에만 적용돼요.'); openSettings();
    };
    im.onerror = () => toast('이미지를 읽지 못했어요.');
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
}
function openBook() {
  const got = new Set(STORE.get('endings', []));
  const H = { happy: `마지막 날 호감도 ${CONFIG.CONFESS_LINE} 이상에서 고백하면…`, normal: '친구로 남는 결말', bad: '호감도가 너무 낮으면…' };
  openOv(`<h2>엔딩 도감 ${got.size}/3</h2>${['happy', 'normal', 'bad'].map(k => { const E = CHAR.endings[k], on = got.has(k); return `<div class="bookRow${on ? '' : ' locked'}"><span class="endTag ${k}">${E.tag}</span><b>${on ? esc(E.title) : '???'}</b><small>${on ? '달성!' : esc(H[k])}</small></div>`; }).join('')}<p></p><button class="btn wide" id="bkC">닫기</button>`);
  $('#bkC').onclick = closeOv;
}

// ------------------------- 시작 -------------------------
function fitVV() {
  const vv = window.visualViewport, h = Math.round(vv ? vv.height : window.innerHeight);
  document.documentElement.style.setProperty('--appH', h + 'px');
  if (vv && vv.offsetTop > 0) window.scrollTo(0, 0);
  syncBar();
}
function init() {
  fitVV();
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fitVV);
  window.addEventListener('resize', fitVV);
  if (window.ResizeObserver) new ResizeObserver(() => syncBar()).observe($('#inputBar'));
  $('#game').addEventListener('click', e => { if (e.target.closest('button,input,textarea,label,a,.screen,#ov,#inputBar,#hud,#choices')) return; advance(); });
  window.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.target.closest('input,textarea,button') && !$('#ov').classList.contains('on')) { e.preventDefault(); advance(); } });
  $('#chatForm').addEventListener('submit', e => { e.preventDefault(); sendTalk($('#chatInput').value); });
  $('#chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b && !b.disabled) sendTalk(b.textContent); });
  $('#dayDone').addEventListener('click', finishDay);
  $('#menuBtn').addEventListener('click', openMenu);
  $('#ov').addEventListener('click', e => { if (e.target.id === 'ov' && !$('#ov').dataset.sticky) closeOv(); });
  showTitle();
}
init();
})();
</script>
